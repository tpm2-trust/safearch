PermitRootLogin no
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
AllowGroups wheel

# /etc is read-only (dm-verity). Keys of the users are part of the verified
# image (created by mkosi.postinst from users.conf), so they cannot be added
# or changed without breaking verity.
AuthorizedKeysFile /etc/ssh/authorized_keys/%u

# The host key, chosen at boot (SECURITY.md, "Machine identity"): aSSH's, made
# in the TPM and certified by the machine's CA in an approved state, else aSSH's
# temporary key (assh-agent.service: HostKey, HostCertificate, HostKeyAgent);
# without a TPM 2.0 a throwaway ed25519 key (sshd-hostkeys.service).
Include /run/safespace/sshd-hostkey.conf
