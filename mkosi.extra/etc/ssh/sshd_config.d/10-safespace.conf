PermitRootLogin no
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
AllowGroups wheel

# /etc is read-only (dm-verity). Keys of the users are part of the verified
# image (created by mkosi.postinst from users.conf), so they cannot be added
# or changed without breaking verity.
AuthorizedKeysFile /etc/ssh/authorized_keys/%u

# Host keys are generated into /var (a tmpfs) by sshd-hostkeys.service, so
# they are new on every boot. See README "Open decisions".
HostKey /var/lib/sshd/etc/ssh/ssh_host_ed25519_key
HostKey /var/lib/sshd/etc/ssh/ssh_host_ecdsa_key
HostKey /var/lib/sshd/etc/ssh/ssh_host_rsa_key
