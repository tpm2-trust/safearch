# aSSH's settings (assh/README.md, "The settings in one file"): the machine's
# host key in the TPM, certified by its CA (SECURITY.md, "Machine identity").
# Part of the verified root, the same in every combination.

# The CA: in an EFI variable (nothing else of the machine survives a reboot),
# created by 'safespace-seal --identity-create'.
ASSH_CA=efi:SAFEasshCA
# Its authority: a key in the TPM, opened by the PIN; a counter revokes every
# approval of an earlier generation ('safespace-seal --move').
ASSH_AUTHORITY_TPM=yes
ASSH_CA_REF="safespace identity"
# The PCR bank: SHA-256, or SHA-1 on a TPM whose firmware activates nothing else,
# only while 'safespace-seal --sha1 on' allows it (the initrd's machine-id alike).
ASSH_CA_BANK=auto
# The slots, tried in order. PCR 15 holds the combination (the initrd's select,
# then identity's "sealed"): both are per combination. Slot 0: firmware (0),
# option ROMs (2), Secure Boot (7), the UKI (11). Slot 1: Secure Boot alone - an
# update (PCR 11), a firmware update or a new option ROM still certify.
ASSH_CA_SLOT_0=0,2,7,11,15
ASSH_CA_SLOT_1=7,15
# PCR 15 is also the window: the agent extends it once the host key is
# certified, so the CA signs nothing more until the next boot.
ASSH_CA_WINDOW=15
ASSH_KEY_ID=safespace
# The PCR state at the agent's start, which safespace-seal approves.
ASSH_STATE=/run/assh/agent.pcrs.json
ASSH_AGENT_DIR=/run/assh
# experiment with RSA
ASSH_CA_TYPE=rsa2048
ASSH_HOSTKEY_TYPE=rsa2048
