# aSSH's settings (assh/README.md, "The settings in one file"): the machine's
# host key in the TPM, certified by its CA (SECURITY.md, "Machine identity").
# Part of the verified root and the initrd, the same in every combination.

# The CA: in an EFI variable, made by the initrd at the first boot with Secure
# Boot on (mkosi.initrd.conf/.../identity), with the machine-id; its private key
# never leaves the TPM.
ASSH_CA=efi:SAFEasshCA
# Its authority exists for that moment alone: it approves the slots below and is
# gone. Nothing can approve another state after; a new identity: safespace
# identity clear.
ASSH_AUTHORITY_ONCE=yes
ASSH_CA_REF="safespace identity"
# The PCR bank: SHA-256, or SHA-1 on a TPM whose firmware activates nothing else,
# only while 'safespace tpm sha1 on' allows it (the initrd's machine-id alike).
ASSH_CA_BANK=auto
# The slots, tried in order. PCR 15 holds the combination (the initrd's select,
# then identity's "sealed"): both are per combination.
# Slot 0: firmware (0), option ROMs (2), Secure Boot (7) as at the creation, and
# a UKI the build host signed (PCR 11, the UKI's own signature): an update keeps
# it, no step needed.
ASSH_CA_SLOT_0=0,2,7,15
ASSH_CA_SLOT_0_SIGNED=11
# Slot 1: Secure Boot and the combination alone - firmware or an option ROM
# changed, or a UKI without the build's signature: certified, shown purple.
ASSH_CA_SLOT_1=7,15
# The build's PCR signing key (in the initrd, where the CA is made: lib/compose.sh
# appends it) and its signatures of the booted UKI, as systemd hands them over.
ASSH_PCR_KEY=/usr/local/lib/safespace/pcr.pem
ASSH_PCR_SIGNATURE=/run/systemd/tpm2-pcr-signature.json
# PCR 15 is also the window: the agent extends it once the host key is
# certified, so the CA signs nothing more until the next boot.
ASSH_CA_WINDOW=15
ASSH_KEY_ID=safespace
# The PCR state at the agent's start.
ASSH_STATE=/run/assh/agent.pcrs.json
ASSH_AGENT_DIR=/run/assh
# The keys: RSA-2048, else ECDSA P-256 where the TPM does not take RSA (the
# first of the list the TPM takes). The agent offers rsa-sha2-512 only where
# the TPM has SHA-512.
ASSH_CA_TYPE=rsa2048,p256
ASSH_HOSTKEY_TYPE=rsa2048,p256
