# QEMU guest agent: replaces the package's file. Started by udev only when the
# VM has the virtio port org.qemu.guest_agent.0; on hardware it never runs.
# allow-rpcs: reporting only, plus shutdown. Not allowed: guest-exec,
# guest-file-*, guest-set-user-password, guest-ssh-*, fsfreeze, ..., so the
# VM host gets no command or file channel into the system.
[general]
daemonize=0
method=virtio-serial
path=/dev/virtio-ports/org.qemu.guest_agent.0
pidfile=/run/qemu-ga.pid
statedir=/run
verbose=0
allow-rpcs=guest-sync,guest-sync-delimited,guest-ping,guest-info,guest-get-osinfo,guest-get-host-name,guest-network-get-interfaces,guest-get-time,guest-get-timezone,guest-get-users,guest-get-fsinfo,guest-shutdown
