# Start usbguard right after local filesystems are mounted, before sysinit.target.
# Until then the kernel itself denies every new USB device
# (usbcore.authorized_default=0), so there is no window without a policy.
[Unit]
DefaultDependencies=no
After=local-fs.target systemd-udevd.service
Before=sysinit.target shutdown.target
Conflicts=shutdown.target
