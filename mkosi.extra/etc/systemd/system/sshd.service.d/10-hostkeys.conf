# The host key: aSSH's (TPM) or, without a TPM 2.0, a throwaway one; each
# writes /run/safespace/sshd-hostkey.conf, which sshd_config includes.
# sshd reads the host key when it starts and asks the agent to sign with it:
# a restarted agent has another key, so sshd restarts with it (PartOf).
[Unit]
Wants=assh-agent.service sshd-hostkeys.service
After=assh-agent.service sshd-hostkeys.service
PartOf=assh-agent.service
