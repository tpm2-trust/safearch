# /home and /root are symlinks into /var (mkosi.postinst), not directories.
# For the same path the file whose name sorts first wins, so these lines
# replace home.conf's "Q /home" and provision.conf's "d- /root", which would
# otherwise warn on every boot that the path is not a directory.
L /home - - - - var/home
L /root - - - - var/roothome
