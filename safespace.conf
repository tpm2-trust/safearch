# The build host's configuration: everything a build can be told, in one file.
# This file holds the project's defaults (tracked); this host's choices go into
# safespace.local.conf (gitignored), whose keys win; build.sh --config FILE adds
# one more layer on top (tests/vm.sh). Read by build.sh, release.sh and
# update-snapshot.sh (lib/conf.sh): parsed, not sourced - KEY=VALUE, # comments,
# only the keys below; an unknown key is an error. Nothing secret goes here.
#
# On the machine nothing is configured: the build writes what it needs into the
# signed image (lib/settings.sh: /etc/assh/assh.conf and
# /usr/local/lib/safespace/settings).

# --- what is built ------------------------------------------------------------
# The combinations, space separated: <name>=<groups>. Each becomes a complete,
# dm-verity protected root of its own; one signed UKI names them all, and a
# machine boots the one selected with safespace select (an EFI variable), the
# first without a selection. Names: lowercase letters, digits and "-", starting
# with a letter, at most 24 characters. Groups (comma separated): lib/groups.sh -
# base, docker (with docker-compose), xfce4-headless-vnc, debug.
COMBINATIONS="root=base containers=base,docker debug=base,debug"
# The users built in, with their ssh keys: a file inside this checkout
# (username:ssh-public-key per line; users.conf.example). Not tracked by git.
USERS=users.conf

# --- where the packages come from ---------------------------------------------
# SNAPSHOT=YYYY/MM/DD  a pinned Arch Linux Archive day: the same date, the same
#                      package versions (./update-snapshot.sh moves it to the newest)
# SNAPSHOT=latest      the current repositories, nothing pinned (build with -f to
#                      install updates; the image cache is reused otherwise)
# MIRROR=              empty: https://archive.archlinux.org for a date,
#                      https://fastly.mirror.pkgbuild.com for latest
# MIRROR=URL           without $repo/os/$arch, mkosi appends that:
#                      a date:  an Arch Linux Archive mirror (URL/repos/<date>/...)
#                      latest:  a normal pacman mirror (https://ftp.fau.de/archlinux)
SNAPSHOT=latest
MIRROR=https://ftp.fau.de/archlinux

# --- the network boot and the release -----------------------------------------
# Where a network-booted machine loads its root from: the distribution servers'
# share (<SERVER_URL>/ of their server.conf), signed into the UKI's command line.
# Several (space separated) are tried in order. Empty: the build boots from
# sticks only. A host name is resolved by the initrd with the DNS servers of its
# DHCP lease (NETBOOT.md); an IP address needs no DNS. build.sh --url wins.
#   NETROOT_URL="http://arch.boot.internal/safespace/ http://10.0.0.2/safespace/"
NETROOT_URL=
# The distribution servers release.sh pushes to without --push, space separated:
# the upload account server/setup.sh made (user@host), or a local share directory.
RELEASE_TARGETS=

# --- the build host -----------------------------------------------------------
# Threads for the erofs compression of the roots (most of a build's time).
# Empty: all available CPUs. build.sh --workers wins.
EROFS_WORKERS=
# The Secure Boot keys: empty for the host's sbctl keys (/var/lib/sbctl), or the
# sbctl.conf of a dedicated key set (keydir:, guid:; README.md, "Secure Boot keys").
SBCTL_CONFIG=

# --- the machine's identity (SECURITY.md, "Machine identity") -----------------
# Decided here, built into the image; build.sh refuses a policy that weakens it:
# PCR 7 (Secure Boot) and PCR 15 (the combination, and aSSH's window) in every
# slot and in the machine-id's PCRs; signed only PCR 11 (the UKI, signed by the
# build); PCRs 0 to 22, not 16. A changed policy applies to identities made
# after it: an existing one keeps its own (a slot it never approved certifies
# nothing: a temporary host key); safespace identity clear and a reboot make one
# under the new policy.
#
# aSSH's slots, tried in order, space separated: the PCRs the CA's state is
# recorded for, comma separated; "+PCR" a PCR signed by the build instead.
#   slot 0: firmware (0), option ROMs (2), Secure Boot (7), the combination (15)
#           as at the creation, and a UKI the build signed (11): an update keeps it
#   slot 1: Secure Boot and the combination alone - firmware or an option ROM
#           changed, or a UKI without the build's signature: certified, purple
IDENTITY_SLOTS="0,2,7,15+11 7,15"
# The machine-id's seal (systemd-creds): as at the creation, "+PCR" signed.
MACHINE_ID_PCRS=7,15+11
# The key types of the host key and the CA, the first the TPM takes: rsa2048
# (RSA-2048), p256 (ECDSA P-256); aSSH's names.
KEY_TYPES=rsa2048,p256
# The PCR bank: auto (SHA-256, or SHA-1 where the TPM's firmware activates
# nothing else and safespace tpm sha1 on allows it), sha256 or sha1.
PCR_BANK=auto
