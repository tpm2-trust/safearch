# Variant "network": UEFI HTTP (or PXE/TFTP) netboot (./build.sh network).
#
# Outputs: the signed UKI that the firmware downloads and starts, plus the
# root partition and its dm-verity hash tree as separate files
# (SplitArtifacts=partitions). netboot-export.sh publishes them, NETBOOT.md
# describes the server.
#
# The image has no ESP (only ../../mkosi.repart/ applies: root + root-verity),
# so the .raw disk image is a by-product; only the split artifacts are used.
# Nothing on the client is written: the root image is fetched into a tmpfs,
# opened read-only through dm-verity, /var is a tmpfs as in the usb variant.

[Output]
ImageId=safespace-arch-network
# partitions: the root and verity partitions as separate files, which is what
# the initrd downloads at boot.
SplitArtifacts=uki,roothash,partitions

[Content]
# root=/dev/mapper/root: the verity device that netroot opens in the initrd
# after downloading the two images (no GPT to find them on). systemd.verity=no
# keeps systemd-veritysetup-generator from looking for partitions by the UUIDs
# derived from roothash= and from opening the same device name a second time;
# netroot passes the root hash and --panic-on-corruption to veritysetup itself.
# safespace.netroot=<base url>: where to fetch root.img and root.verity from.
# build.sh appends the image version to the URL from netboot.conf, so a UKI
# always loads the root it was signed with. Both values are part of the signed
# command line: a manipulated server cannot change what boots, only refuse to
# serve it.
# usbcore.authorized_default=0: as in the usb variant the kernel authorizes no
# USB device. Nothing is needed from USB here (the NIC must be PCI/PCIe), so
# there is no initrd step that authorizes anything; usbguard decides later.
KernelCommandLine=
        root=/dev/mapper/root
        rootfstype=erofs
        ro
        systemd.verity=no
        rd.systemd.verity=no
        usbcore.authorized_default=0

# curl and veritysetup are pulled in by the initrd anyway; name them so a
# changed dependency does not silently break the netboot path. iproute2 is for
# looking around in the initrd emergency shell.
InitrdPackages=
        curl
        cryptsetup
        iproute2

# Initrd drivers for the boot path, added to the common list in ../../mkosi.conf:
# the client NIC families, plus PHY/MDIO helpers and their firmware. No server
# NICs (Mellanox, QLogic, Chelsio, Solarflare, Intel i40e/ice, Broadcom bnx2x,
# ...): add a line here to netboot one.
KernelInitrdModules=
        /drivers/net/ethernet/intel/e1000/
        /drivers/net/ethernet/intel/e1000e/
        /drivers/net/ethernet/intel/igb/
        /drivers/net/ethernet/intel/igc/
        /drivers/net/ethernet/intel/ixgbe/
        /drivers/net/ethernet/realtek/
        /drivers/net/ethernet/broadcom/tg3
        /drivers/net/ethernet/broadcom/b44
        /drivers/net/ethernet/marvell/sky2
        /drivers/net/ethernet/atheros/
        /drivers/net/ethernet/aquantia/
        /drivers/net/ethernet/amd/pcnet32
        /drivers/net/phy/
        /drivers/net/mdio/
