# Profile "debug": diagnostic tools on top of a variant, for investigating a
# machine over ssh (./build.sh <variant> --debug). build.sh appends "-debug"
# to the image version, so such a build is recognisable in every file name,
# in the netboot tree and in the netroot URL, and is never mistaken for a
# production build.

[Content]
Packages=
        dmidecode
        ethtool
        iperf3
        kexec-tools
        lshw
        pciutils
        tcpdump
        usbutils
