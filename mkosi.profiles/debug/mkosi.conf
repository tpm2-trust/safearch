# Package group "debug" (combination debug in combinations.conf): diagnostic
# tools for investigating a machine over ssh. Packages only: no setting of the
# image depends on this group, the kernel lockdown applies as everywhere
# (kexec-tools can only load signed kernels, lshw has no /dev/mem).

[Content]
Packages=
        dmidecode
        ethtool
        iperf3
        kexec-tools
        lshw
        pciutils
        tcpdump
        usbutils
