# Package group "debug" (combination debug in safespace.conf): diagnostic
# tools for investigating a machine over ssh (tpm2-tools: the TPM itself, e.g.
# tpm2_getcap, tpm2_testparms). Packages only: no setting of the
# image depends on this group, the kernel lockdown applies as everywhere
# (kexec-tools can only load signed kernels, lshw has no /dev/mem).

[Content]
Packages=
        dmidecode
        ethtool
        iperf3
        kexec-tools
        lshw
        pciutils
        tcpdump
        tpm2-tools
        usbutils
