# Package group "remotedesktop" (./build.sh <variant> --groups base,remotedesktop):
# an XFCE desktop served by TigerVNC on localhost (reach it through an ssh
# tunnel), with a browser and media tools. Settings: VNC_* in safespace.env;
# mkosi.postinst sets up the VNC user and password only with this group.

[Content]
Packages=
        xfce4
        xfce4-goodies
        tigervnc
        firefox
        vlc
        vlc-plugins-all
        gwenview
        ffmpegthumbnailer
        gnu-free-fonts
        pulseaudio
        pulseaudio-alsa
