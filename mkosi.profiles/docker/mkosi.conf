# Package group "docker" (./build.sh <variant> --groups base,docker): Docker
# with its storage on a data disk labelled safespace-docker (mounted at
# /opt/docker, the mount entry is added by mkosi.postinst), the shipped images
# (fetch-images.sh) and their loader. Docker is not started at boot. Users get
# the docker group (mkosi.postinst). See README.md, "Docker".

[Content]
Packages=
        docker
        btrfs-progs
