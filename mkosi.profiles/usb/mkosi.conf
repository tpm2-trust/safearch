# Variant "usb": a bootable USB stick or SD card (./build.sh usb).
#
# The whole system is on the medium: ESP with signed systemd-boot and UKI,
# erofs root, dm-verity hash tree. Kept and shipped as parts like the network
# variant (mkosi.conf, SplitArtifacts=); burn.sh assembles the stick from them
# with the partition table the build recorded, diagnose.sh checks it.
# mkosi.repart/ next to this file adds the ESP to the common definitions in
# ../../mkosi.repart/ (root and root-verity).

[Output]
ImageId=safespace-arch-usb

[Content]
# usbcore.authorized_default=0: the kernel authorizes no USB device; the initrd
# step usb-bootdev (mkosi.initrd.conf/mkosi.profiles/usb/) authorizes only the
# path to root and then marks the whole medium read-only at block level.
# systemd.verity_root_options=panic-on-corruption: a modified or damaged root
# block stops the system instead of just failing that one read (systemd opens
# the verity device here; in the network variant netroot passes
# --panic-on-corruption to veritysetup itself).
KernelCommandLine=
        usbcore.authorized_default=0
        systemd.verity_root_options=panic-on-corruption

# Initrd drivers for the boot path, added to the common list in ../../mkosi.conf:
# USB sticks (usb-storage, uas), SD card readers (including readers behind
# USB), and the USB host controller modules that are not built in.
KernelInitrdModules=
        /drivers/usb/host/
        /drivers/usb/storage/
        /drivers/mmc/
        /drivers/misc/cardreader/
