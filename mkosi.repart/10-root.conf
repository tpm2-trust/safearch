# Read-only root (/usr and /etc), erofs with zstd, protected by dm-verity.
# Its partition UUID is derived from the verity root hash (first 128 bits),
# which mkosi puts into the signed kernel command line as roothash=.
# /var, /efi and /boot are only mount points here; their content lives in
# their own partitions.
[Partition]
Type=root
Format=erofs
CopyFiles=/
ExcludeFilesTarget=/var/ /efi/ /boot/
Verity=data
VerityMatchKey=root
Minimize=best
Compression=zstd
CompressionLevel=12
