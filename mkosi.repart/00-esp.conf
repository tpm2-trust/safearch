# EFI System Partition: signed systemd-boot (\EFI\BOOT\BOOTX64.EFI) and the
# signed UKI (\EFI\Linux\<image>.efi), nothing else.
# Never mounted at runtime (efi/boot mounts are masked), so it stays untouched.
[Partition]
Type=esp
Format=vfat
CopyFiles=/efi:/
CopyFiles=/boot:/
# Not needed: the UKI carries its own microcode; systemd-boot runs on its
# defaults (no loader.conf, no type 1 entries, no random seed to rewrite); the
# copy in \EFI\systemd\ only matters for NVRAM boot entries, which are not used.
ExcludeFiles=/boot/intel-ucode.img
ExcludeFiles=/boot/loader
ExcludeFiles=/efi/loader
ExcludeFiles=/efi/EFI/systemd
ExcludeFiles=/efi/EFI/BOOT/BOOTIA32.EFI
SizeMinBytes=512M
SizeMaxBytes=512M
# Not split out: the build keeps systemd-boot and the UKI themselves, and
# burn.sh creates the ESP on the stick (lib/stick.sh).
SplitName=-
