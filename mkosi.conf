# Safespace Arch, built with mkosi (https://github.com/systemd/mkosi, written for v27).
# See README.md, section "What differs from a plain mkosi build".
#
# One build for both boot paths: the same signed UKI and root boot from a USB
# stick / SD card and over the network (UEFI HTTP/PXE, see NETBOOT.md); the
# initrd tells them apart at boot (usb-bootdev / netroot in
# mkosi.initrd.conf/). Package groups on top of the base system
# (mkosi.profiles/<group>/), one root per combination of combinations.conf.
# The package source (snapshot, mirror) is in repos.conf; build.sh passes it
# as --snapshot/--mirror.

[Distribution]
Distribution=arch

[Output]
Format=disk
ImageId=safespace-arch
# build.sh gives every combination's mkosi run a directory of its own and
# composes the build from them (mkosi.output/combined_<version>/).
OutputDirectory=mkosi.output
# ImageVersion comes from ./mkosi.version (build timestamp); build.sh passes it.
# Each combination is kept and shipped as parts (lib/builds.sh,
# builds_finalize): the signed UKI, the root partition, its dm-verity hash tree
# and the root hash, the signed systemd-boot and the partition table, from
# which burn.sh assembles a stick. The whole disk
# image is only an intermediate and is deleted after the build.
SplitArtifacts=uki,roothash,partitions
# Uncompressed: the root is erofs and compressed already (zstd would save
# ~9%), and the files are shipped as they are, so nothing is ever unpacked.
CompressOutput=no
ManifestFormat=json
# mkosi adds an ISO9660/El Torito header for CD boot by default. A stick boots
# via GPT; firmware that sees the CD header may take the wrong path.
ElTorito=no
# Partition layout: mkosi.repart/ (ESP, read-only erofs root, dm-verity hash
# partition). Over the network only the root and its hash tree are used.
# Nothing on the medium is writable.

[Content]
Packages=
        base
        linux
        linux-firmware
        intel-ucode
        cryptsetup
        efitools
        openssh
        nftables
        sudo
        usbguard
        vim
        tmux
        # Reports IP addresses, OS and host name to the hypervisor when run as a
        # VM (started by udev only if the virtio port exists; restricted in
        # /etc/qemu/qemu-ga.conf)
        qemu-guest-agent
        # A data disk may be btrfs (Docker's data disk, any other)
        btrfs-progs
# Package groups on top of this base (desktop, Docker, debug tools):
# mkosi.profiles/<group>/, combined in combinations.conf (lib/groups.sh).

Bootable=yes
# systemd-boot (signed with the same key) as \EFI\BOOT\BOOTX64.EFI, the UKI
# in \EFI\Linux\. Some firmware resets when its boot manager starts a 90 MiB
# UKI directly as BOOTX64.EFI, but loads it fine for systemd-boot (found with
# hwtest-image.sh). No loader.conf (see mkosi.repart/00-esp.conf): timeout 0,
# the one UKI boots right away, no NVRAM entry needed. mkosi deletes
# loader/random-seed, so systemd-boot never writes to the stick. Over the
# network the firmware starts the UKI itself.
Bootloader=systemd-boot

# mkosi appends roothash=<verity root hash> to each combination's UKI; the
# composed UKI that ships replaces it with safespace.root.<name>=<hash> per
# combination (lib/compose.sh). The initrd opens the selected combination's
# root with its hash as /dev/mapper/root (root=), read-only through dm-verity
# with --panic-on-corruption, on either path (mkosi.initrd.conf/):
#   from a stick/SD card (LoaderDevicePartUUID is set: systemd-boot started
#   the UKI from a partition): usb-bootdev authorizes the USB path, waits for
#   the root and hash partitions by the UUIDs derived from the root hash and
#   opens them
#   over the network (no LoaderDevicePartUUID: the firmware loaded the UKI):
#   netroot fetches root-<name>.img and root-<name>.verity from
#   safespace.netroot= (added by build.sh from netboot.conf) into a tmpfs and
#   opens them
# systemd.verity=no (+ rd.): systemd-veritysetup-generator stays out of it, the
# two scripts open the root themselves.
# usbcore.authorized_default=0: the kernel authorizes no USB device; only
# usb-bootdev authorizes the path to the stick (nothing over the network: the
# NIC must be PCI/PCIe), usbguard decides later.
# systemd.volatile=state: /var is a tmpfs, filled from /usr/share/factory/var
# on every boot (safespace-var-factory.service). The medium is never written.
# The ESP (usb) is not covered by dm-verity, and systemd-stub hands files from
# it to the system. Close those paths:
# - systemd.credentials_boot_policy=strict: never accept credentials
#   "encrypted" with the null key (default "relaxed" accepts them on machines
#   without TPM2, e.g. a planted systemd.extra-unit.* credential = root code).
# - systemd.sysext=0 / systemd.confext=0 (+ rd. variants for the initrd): no
#   extension images overlaid onto the verified /usr and /etc. The units are
#   also masked (mkosi.extra/, mkosi.initrd.conf/mkosi.extra/).
# lockdown=integrity: the Arch kernel does not lock itself down under Secure
# Boot (LOCK_DOWN_KERNEL_FORCE_NONE). Without it root could kexec an unsigned
# kernel, load unsigned modules, write /dev/mem or MSRs, i.e. leave the signed
# boot chain at runtime. Signed into the UKI, so it cannot be dropped at boot;
# mkosi.postoutput refuses an image without it. Not "confidentiality": that
# also blocks perf/kprobes and BPF reads of kernel memory (no tracing at all).
# Add "quiet" once the machine boots reliably.
KernelCommandLine=
        root=/dev/mapper/root
        rootfstype=erofs
        ro
        systemd.verity=no
        rd.systemd.verity=no
        usbcore.authorized_default=0
        systemd.firstboot=off
        systemd.volatile=state
        systemd.credentials_boot_policy=strict
        systemd.sysext=0
        systemd.confext=0
        rd.systemd.sysext=0
        rd.systemd.confext=0
        lockdown=integrity

# Default initrd (built by mkosi from Arch packages, systemd based): the tools
# the initrd scripts need (curl and veritysetup are pulled in anyway; named so a
# changed dependency does not silently break a boot path; iproute2 for looking
# around in the emergency shell). Drivers: an explicit list instead of mkosi's
# default set, for both boot paths (~1 MiB for the USB/SD part). It keeps the
# UKI small enough for firmware that cannot start a large network boot program
# (NETBOOT.md, "Size of the network UKI"). Keyboard, efivarfs, autofs, TPM,
# SCSI disks, the usual USB host controllers and virtio_pci are built into the
# Arch kernel.
#   dm-mod, dm-verity, loop, erofs  open and mount the verified root
#   crypto/                         hashes for dm-verity (as in mkosi's default)
#   virtio_net, virtio-rng          QEMU (test-vm.sh)
#   usb host, usb storage, mmc, card readers   sticks and SD cards (also SD
#                                   readers behind USB)
#   ethernet                        the client NIC families, plus PHY/MDIO
#                                   helpers and their firmware. No server NICs
#                                   (Mellanox, QLogic, Chelsio, Solarflare,
#                                   Intel i40e/ice, Broadcom bnx2x, ...): add a
#                                   line to netboot one.
# Not in the initrd: other storage, filesystems other than erofs, md-raid,
# wireless, thunderbolt.
InitrdPackages=
        coreutils
        sed
        kmod
        curl
        cryptsetup
        iproute2
KernelInitrdModules=
        dm-mod
        dm-verity
        loop
        erofs
        crypto/
        -/drivers/crypto/
        virtio_net
        virtio-rng
        /drivers/usb/host/
        /drivers/usb/storage/
        /drivers/mmc/
        /drivers/misc/cardreader/
        /drivers/net/ethernet/intel/e1000/
        /drivers/net/ethernet/intel/e1000e/
        /drivers/net/ethernet/intel/igb/
        /drivers/net/ethernet/intel/igc/
        /drivers/net/ethernet/intel/ixgbe/
        /drivers/net/ethernet/realtek/
        /drivers/net/ethernet/broadcom/tg3
        /drivers/net/ethernet/broadcom/b44
        /drivers/net/ethernet/marvell/sky2
        /drivers/net/ethernet/atheros/
        /drivers/net/ethernet/aquantia/
        /drivers/net/ethernet/amd/pcnet32
        /drivers/net/phy/
        /drivers/net/mdio/

Hostname=safespace
Locale=en_US.UTF-8
Keymap=us
Timezone=UTC

# mkosi would otherwise add its own sshd-over-vsock units for `mkosi vm`.
Ssh=never

[Validation]
# Sign the UKI with the host's sbctl db key. The key is root-only, so run
# mkosi with sudo.
SecureBoot=yes
SecureBootKey=/var/lib/sbctl/keys/db/db.key
SecureBootCertificate=/var/lib/sbctl/keys/db/db.pem
SecureBootSignTool=systemd-sbsign
# Key-enrollment files are for systemd-boot, which this image does not use.
SecureBootAutoEnroll=no
# Signed expected PCR 11 values in the UKI (.pcrsig/.pcrpkey), so the TPM can
# bind secrets to "this signed safespace UKI booted", and systemd's NvPCRs
# (systemd-tpm2-setup, systemd-pcrproduct, ...) can be initialized: without a
# PCR public key they fail on every machine with a TPM 2.0. A key of its own,
# not the Secure Boot db key: rotating one does not touch the other. build.sh
# creates it on the first build (root-only, never in the image; only the public
# key goes into the UKI). Per host: SignExpectedPcrKey=/SignExpectedPcrCertificate=
# in mkosi.local.conf.
SignExpectedPcr=yes
SignExpectedPcrKey=/var/lib/safespace/pcr-signing/pcr.key
SignExpectedPcrCertificate=/var/lib/safespace/pcr-signing/pcr.crt
# dm-verity hash partition for root, no signature partition: the root hash is
# already protected by being part of the signed UKI's command line.
Verity=hash

[Build]
# Level 1: downloaded packages. Level 2: the installed system (Incremental).
PackageCacheDirectory=mkosi.pkgcache
CacheDirectory=mkosi.cache
Incremental=yes
# systemd-repart formats vfat with 4096-byte sectors by default, which many
# UEFI firmwares cannot read on a USB stick/SD card (512-byte sectors). Force
# 512 for the ESP only. (SectorSize=512 would do this too, but would also
# shrink the erofs and dm-verity blocks to 512: 10x bigger hash tree.)
Environment=SYSTEMD_REPART_MKFS_OPTIONS_VFAT=-S512
# Threads for the erofs compression (default 4): per build host, in
# mkosi.local.conf (see mkosi.local.conf.example). zstd for the image and the
# initrd already uses all cores (-T0).
