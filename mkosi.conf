# Safespace Arch, built with mkosi (https://github.com/systemd/mkosi, written for v27).
# See README.md, section "What differs from a plain mkosi build".
# The package snapshot is pinned in mkosi.conf.d/20-snapshot.conf.

[Distribution]
Distribution=arch

[Output]
Format=disk
ImageId=safespace-arch
# Without this, mkosi writes into the project folder unless mkosi.output/ exists.
OutputDirectory=mkosi.output
# ImageVersion comes from ./mkosi.version (build timestamp).
CompressOutput=zstd
CompressLevel=10
# Also write the signed UKI (size check in mkosi.postoutput) and the verity
# root hash next to the image.
SplitArtifacts=uki,roothash
ManifestFormat=json
# mkosi adds an ISO9660/El Torito header for CD boot by default. A stick boots
# via GPT; firmware that sees the CD header may take the wrong path.
ElTorito=no
# Partition layout: mkosi.repart/ (ESP, read-only erofs root + dm-verity hash
# partition). Nothing on the stick is writable.

[Content]
Packages=
        base
        linux
        linux-firmware
        btrfs-progs
        cryptsetup
        vim
        intel-ucode
        systemd-ukify
        efibootmgr
        openssh
        nftables
        tinyssh
        sbctl
        efitools
        sudo
        dhclient
        usbguard
        tmux
        docker
        # Desktop: XFCE, served over VNC (see safespace.env)
        xfce4
        xfce4-goodies
        firefox
        vlc
        vlc-plugins-all
        gwenview
        ffmpegthumbnailer
        gnu-free-fonts
        tigervnc
        pulseaudio
        pulseaudio-alsa

Bootable=yes
# systemd-boot (signed with the same key) as \EFI\BOOT\BOOTX64.EFI, the UKI
# in \EFI\Linux\. Some firmware resets when its boot manager starts a 90 MiB
# UKI directly as BOOTX64.EFI, but loads it fine for systemd-boot (found with
# hwtest-image.sh). No loader.conf (see mkosi.repart/00-esp.conf): timeout 0,
# the one UKI boots right away, no NVRAM entry needed. mkosi deletes
# loader/random-seed, so systemd-boot never writes to the stick.
Bootloader=systemd-boot

# mkosi appends roothash=<verity root hash> itself; the initrd finds the root
# and hash partitions by the UUIDs derived from it and mounts root read-only
# through dm-verity. No root= here (mkosi docs: must not be set with verity).
# systemd.volatile=state: /var is a tmpfs, filled from /usr/share/factory/var
# on every boot (safespace-var-factory.service). The stick is never written.
# usbcore.authorized_default=0: the kernel authorizes no USB device; the initrd
# step usb-bootdev (mkosi.initrd.conf/) authorizes only the path to root and
# then marks the whole stick read-only at block level.
# The ESP is not covered by dm-verity, and systemd-stub hands files from it to
# the system. Close those paths:
# - systemd.credentials_boot_policy=strict: never accept credentials
#   "encrypted" with the null key (default "relaxed" accepts them on machines
#   without TPM2, e.g. a planted systemd.extra-unit.* credential = root code).
# - systemd.sysext=0 / systemd.confext=0 (+ rd. variants for the initrd): no
#   extension images overlaid onto the verified /usr and /etc. The units are
#   also masked (mkosi.extra/, mkosi.initrd.conf/mkosi.extra/).
# systemd.verity_root_options=panic-on-corruption: a modified or damaged root
# block stops the system instead of just failing that one read.
# Add "quiet" once the stick boots reliably.
KernelCommandLine=
        systemd.firstboot=off
        systemd.volatile=state
        usbcore.authorized_default=0
        systemd.credentials_boot_policy=strict
        systemd.sysext=0
        systemd.confext=0
        rd.systemd.sysext=0
        rd.systemd.confext=0
        systemd.verity_root_options=panic-on-corruption

# Default initrd (built by mkosi from Arch packages, systemd based):
# the tools usb-bootdev needs, and drivers for USB sticks and SD card readers.
InitrdPackages=
        coreutils
        sed
        kmod
KernelInitrdModules=
        default
        /drivers/usb/storage/
        /drivers/mmc/
        /drivers/misc/cardreader/

Hostname=safespace
Locale=en_US.UTF-8
Keymap=us
Timezone=UTC

# mkosi would otherwise add its own sshd-over-vsock units for `mkosi vm`.
Ssh=never

[Validation]
# Sign the UKI with the host's sbctl db key. The key is root-only, so run
# mkosi with sudo.
SecureBoot=yes
SecureBootKey=/var/lib/sbctl/keys/db/db.key
SecureBootCertificate=/var/lib/sbctl/keys/db/db.pem
SecureBootSignTool=systemd-sbsign
# Key-enrollment files are for systemd-boot, which this image does not use.
SecureBootAutoEnroll=no
# dm-verity hash partition for root, no signature partition: the root hash is
# already protected by being part of the signed UKI's command line.
Verity=hash

[Build]
# Level 1: downloaded packages. Level 2: the installed system (Incremental).
PackageCacheDirectory=mkosi.pkgcache
CacheDirectory=mkosi.cache
Incremental=yes
# systemd-repart formats vfat with 4096-byte sectors by default, which many
# UEFI firmwares cannot read on a USB stick/SD card (512-byte sectors). Force
# 512 for the ESP only. (SectorSize=512 would do this too, but would also
# shrink the erofs and dm-verity blocks to 512: 10x bigger hash tree.)
Environment=SYSTEMD_REPART_MKFS_OPTIONS_VFAT=-S512
# Threads for the erofs compression (default 4): per build host, in
# mkosi.local.conf (see mkosi.local.conf.example). zstd for the image and the
# initrd already uses all cores (-T0).
