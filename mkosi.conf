# Safespace Arch, built with mkosi (https://github.com/systemd/mkosi, written for v27).
# See README.md, section "What differs from a plain mkosi build".
#
# Two variants, picked with a profile (./build.sh usb|network, see
# mkosi.profiles/), and package groups on top of the base system
# (./build.sh <variant> --groups base,remotedesktop,docker):
#   usb      a bootable stick or SD card: ESP + dm-verity root on the medium
#   network  UEFI HTTP/PXE netboot: a signed UKI plus the root images served
#            from a netboot server (see NETBOOT.md)
# This file holds everything the two have in common. The package source
# (snapshot, mirror) is in repos.conf; build.sh passes it as --snapshot/--mirror.

[Distribution]
Distribution=arch

[Output]
Format=disk
# ImageId (safespace-arch-usb / safespace-arch-network) is set per variant in
# mkosi.profiles/<variant>/mkosi.conf. build.sh gives every build a directory
# of its own (mkosi.output/<variant>/<groups>_<version>/).
OutputDirectory=mkosi.output
# ImageVersion comes from ./mkosi.version (build timestamp); build.sh passes it.
# Both variants are kept and shipped as the same parts (lib/builds.sh,
# builds_finalize): the signed UKI, the root partition, its dm-verity hash tree
# and the root hash; the usb variant also the signed systemd-boot and the
# partition table, from which burn.sh assembles the stick. The whole disk
# image is only an intermediate and is deleted after the build.
SplitArtifacts=uki,roothash,partitions
# Uncompressed: the root is erofs and compressed already (zstd would save
# ~9%), and the files are shipped as they are, so nothing is ever unpacked.
CompressOutput=no
ManifestFormat=json
# mkosi adds an ISO9660/El Torito header for CD boot by default. A stick boots
# via GPT; firmware that sees the CD header may take the wrong path.
ElTorito=no
# Partition layout: mkosi.repart/ (read-only erofs root + dm-verity hash
# partition). The usb variant adds the ESP (mkosi.profiles/usb/mkosi.repart/);
# the network variant has no ESP, its root images are served over HTTP.
# Nothing on the medium is writable.

[Content]
Packages=
        base
        linux
        linux-firmware
        intel-ucode
        cryptsetup
        efitools
        openssh
        nftables
        sudo
        usbguard
        vim
        tmux
        # Reports IP addresses, OS and host name to the hypervisor when run as a
        # VM (started by udev only if the virtio port exists; restricted in
        # /etc/qemu/qemu-ga.conf)
        qemu-guest-agent
# Package groups on top of this base (desktop, Docker): mkosi.profiles/<group>/,
# picked with ./build.sh <variant> --groups base,... (lib/groups.sh).

Bootable=yes
# systemd-boot (signed with the same key) as \EFI\BOOT\BOOTX64.EFI, the UKI
# in \EFI\Linux\. Some firmware resets when its boot manager starts a 90 MiB
# UKI directly as BOOTX64.EFI, but loads it fine for systemd-boot (found with
# hwtest-image.sh). No loader.conf (see mkosi.profiles/usb/mkosi.repart/00-esp.conf):
# timeout 0, the one UKI boots right away, no NVRAM entry needed. mkosi deletes
# loader/random-seed, so systemd-boot never writes to the stick.
# The network variant has no ESP, so its systemd-boot is never used; the
# setting stays here so both variants build and sign the UKI the same way.
Bootloader=systemd-boot

# mkosi appends roothash=<verity root hash> itself. The usb variant finds the
# root and hash partitions by the UUIDs derived from it; the network variant
# fetches both over HTTP and opens them with that hash (see netroot in
# mkosi.initrd.conf/mkosi.profiles/network/). Either way root is mounted
# read-only through dm-verity. No root= here for usb (mkosi docs: must not be
# set with verity); the network variant sets root=/dev/mapper/root.
# systemd.volatile=state: /var is a tmpfs, filled from /usr/share/factory/var
# on every boot (safespace-var-factory.service). The medium is never written.
# The ESP (usb) is not covered by dm-verity, and systemd-stub hands files from
# it to the system. Close those paths:
# - systemd.credentials_boot_policy=strict: never accept credentials
#   "encrypted" with the null key (default "relaxed" accepts them on machines
#   without TPM2, e.g. a planted systemd.extra-unit.* credential = root code).
# - systemd.sysext=0 / systemd.confext=0 (+ rd. variants for the initrd): no
#   extension images overlaid onto the verified /usr and /etc. The units are
#   also masked (mkosi.extra/, mkosi.initrd.conf/mkosi.extra/).
# Add "quiet" once the machine boots reliably.
KernelCommandLine=
        systemd.firstboot=off
        systemd.volatile=state
        systemd.credentials_boot_policy=strict
        systemd.sysext=0
        systemd.confext=0
        rd.systemd.sysext=0
        rd.systemd.confext=0

# Default initrd (built by mkosi from Arch packages, systemd based): the tools
# the initrd scripts need. Drivers: an explicit list instead of mkosi's default
# set, the same for both variants, plus the boot path's drivers per variant
# (USB storage and SD card readers for usb, ethernet for network; in
# mkosi.profiles/<variant>/). It keeps the UKI small enough for firmware that
# cannot start a large network boot program (NETBOOT.md, "Size of the network
# UKI"). Keyboard, efivarfs, autofs, TPM, SCSI disks, the USB host controllers
# and virtio_pci are built into the Arch kernel.
#   dm-mod, dm-verity, loop, erofs  open and mount the verified root
#   crypto/                         hashes for dm-verity (as in mkosi's default)
#   virtio_net, virtio-rng          QEMU (test-vm.sh)
# Not in the initrd: storage other than the boot path, filesystems other than
# erofs, md-raid, wireless, thunderbolt.
InitrdPackages=
        coreutils
        sed
        kmod
KernelInitrdModules=
        dm-mod
        dm-verity
        loop
        erofs
        crypto/
        -/drivers/crypto/
        virtio_net
        virtio-rng

Hostname=safespace
Locale=en_US.UTF-8
Keymap=us
Timezone=UTC

# mkosi would otherwise add its own sshd-over-vsock units for `mkosi vm`.
Ssh=never

[Validation]
# Sign the UKI with the host's sbctl db key. The key is root-only, so run
# mkosi with sudo.
SecureBoot=yes
SecureBootKey=/var/lib/sbctl/keys/db/db.key
SecureBootCertificate=/var/lib/sbctl/keys/db/db.pem
SecureBootSignTool=systemd-sbsign
# Key-enrollment files are for systemd-boot, which this image does not use.
SecureBootAutoEnroll=no
# Signed expected PCR 11 values in the UKI (.pcrsig/.pcrpkey), so the TPM can
# bind secrets to "this signed safespace UKI booted", and systemd's NvPCRs
# (systemd-tpm2-setup, systemd-pcrproduct, ...) can be initialized: without a
# PCR public key they fail on every machine with a TPM 2.0. A key of its own,
# not the Secure Boot db key: rotating one does not touch the other. build.sh
# creates it on the first build (root-only, never in the image; only the public
# key goes into the UKI). Per host: SignExpectedPcrKey=/SignExpectedPcrCertificate=
# in mkosi.local.conf.
SignExpectedPcr=yes
SignExpectedPcrKey=/var/lib/safespace/pcr-signing/pcr.key
SignExpectedPcrCertificate=/var/lib/safespace/pcr-signing/pcr.crt
# dm-verity hash partition for root, no signature partition: the root hash is
# already protected by being part of the signed UKI's command line.
Verity=hash

[Build]
# Level 1: downloaded packages. Level 2: the installed system (Incremental).
PackageCacheDirectory=mkosi.pkgcache
CacheDirectory=mkosi.cache
Incremental=yes
# systemd-repart formats vfat with 4096-byte sectors by default, which many
# UEFI firmwares cannot read on a USB stick/SD card (512-byte sectors). Force
# 512 for the ESP only. (SectorSize=512 would do this too, but would also
# shrink the erofs and dm-verity blocks to 512: 10x bigger hash tree.)
Environment=SYSTEMD_REPART_MKFS_OPTIONS_VFAT=-S512
# Threads for the erofs compression (default 4): per build host, in
# mkosi.local.conf (see mkosi.local.conf.example). zstd for the image and the
# initrd already uses all cores (-T0).
