# What build.sh builds: one combination of package groups per line,
# <name>=<groups>. Each becomes a complete, dm-verity protected root of its
# own; one signed UKI names them all (safespace.root.<name>=<root hash>), and a
# machine boots the one selected with safespace-select (an EFI variable), the
# first line without a selection. Names: lowercase letters, digits and "-",
# starting with a letter, at most 24 characters. Groups: lib/groups.sh.
root=base
containers=base,docker
#remotedesktop=base,xfce4-headless-vnc
#remote-workstation=base,docker,xfce4-headless-vnc
#debug=base,debug
