# The group combinations build.sh --combined builds in one run, as
# <name>=<groups>. Each becomes a complete, dm-verity protected root; one signed
# UKI names them all (safespace.root.<name>=<root hash>), and a machine boots
# the one selected with safespace-select (an EFI variable), "base" without a
# selection. Names: lowercase letters, digits and "-", starting with a letter.
base=base
docker=base,docker
