# The test's third build (tests/vm.sh, step identity-policy), on top of
# vm.safespace.conf: another identity policy than safespace.conf's - one slot
# without the option ROMs (PCR 2), ECDSA keys only - to see it reach the
# identity it makes.
COMBINATIONS="root=base"
IDENTITY_SLOTS=0,7,15+11
KEY_TYPES=p256
