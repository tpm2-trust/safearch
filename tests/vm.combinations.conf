# The combinations of the test build (tests/vm.sh: build.sh --combinations).
# Few, so the test is fast; real builds have theirs in combinations.conf.
#   root        the default (booted without a selection): base
#   containers  a group on top (the docker command and group are checked)
#   debug       the default plus debug: must have the same attack surface, and
#               must never get the identity of a machine that belongs to root
root=base
containers=base,docker
debug=base,debug
