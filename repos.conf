# Where the image's packages come from (read by build.sh and update-snapshot.sh;
# parsed, not sourced: only these two keys). Per-host overrides go into
# repos.local.conf (gitignored, see repos.local.conf.example); its keys win.
#
# SNAPSHOT=YYYY/MM/DD  pinned Arch Linux Archive day: same date = same package
#                      versions. ./update-snapshot.sh moves it to the newest day.
# SNAPSHOT=latest      the current repositories, nothing pinned (rebuild with -f
#                      to pick up updates, the incremental cache is reused otherwise)
#
# MIRROR=              empty: https://archive.archlinux.org for a date,
#                      https://fastly.mirror.pkgbuild.com for latest
# MIRROR=URL           base URL without $repo/os/$arch, mkosi appends that:
#                      date:   an Arch Linux Archive mirror, used as URL/repos/<date>/$repo/os/$arch
#                      latest: a normal pacman mirror, used as URL/$repo/os/$arch
#                              (https://ftp.fau.de/archlinux, not https://ftp.fau.de)
SNAPSHOT=latest
MIRROR=https://ftp.fau.de/archlinux
