# Extra configuration for mkosi's default initrd. mkosi parses this directory
# like a config directory, so mkosi.extra/ next to this file is copied into
# the initrd: here the masks for the sysext/confext units (extension images
# must never be merged into the verified /usr and /etc).
#
# The build profile is inherited, so mkosi.profiles/<variant>/mkosi.extra/
# next to this file is copied in as well:
#   usb      usb-bootdev.service + script (authorize only the boot medium)
#   network  netroot.service + script (fetch and verify root over HTTP) and
#            the networkd config for the initrd
# (Packages and drivers for the initrd are set with InitrdPackages= and
# KernelInitrdModules= in ../mkosi.conf and ../mkosi.profiles/<variant>/.)

[Output]
# The initrd sits inside the UKI, which firmware loads over its own USB driver.
CompressLevel=19

[Content]
# Pulled in as dependencies, unused in the initrd (~25 MB uncompressed).
RemoveFiles=
        /usr/bin/sql*
        /usr/bin/showdb
        /usr/bin/showstat4
        /usr/bin/dbhash
        /usr/bin/dbdump
        /usr/bin/index_usage
        /usr/share/file/misc/magic.mgc

# Both variants: drop what the initrd never runs, to keep the UKI small enough
# for firmware that cannot start a large network boot program (ThinkPad T450s:
# 82 MiB fine, 112 MiB not; see NETBOOT.md). The initrd scripts need networkd,
# curl, losetup, veritysetup, blockdev, udevadm, mount and coreutils; the
# emergency shell keeps bash, less, systemctl and journalctl. mkosi's Arch
# initrd installs filesystem tools for every root it may meet (btrfs, ext4,
# xfs, vfat); the root here is erofs on dm-verity, never checked or created.

# filesystem tools (btrfs-progs, xfsprogs, e2fsprogs, dosfstools)
RemoveFiles=
        /usr/bin/btrfs*
        /usr/bin/mkfs.*
        /usr/bin/fsck.*
        /usr/bin/xfs_*
        /usr/bin/mke2fs
        /usr/bin/e2*
        /usr/bin/e4*
        /usr/bin/debugfs
        /usr/bin/dumpe2fs
        /usr/bin/resize2fs
        /usr/bin/tune2fs
        /usr/bin/badblocks
        /usr/bin/filefrag
        /usr/bin/mklost+found
        /usr/bin/mkdosfs
        /usr/bin/dosfsck
        /usr/bin/dosfslabel
        /usr/bin/fatlabel

# systemd tools without a job in this initrd
RemoveFiles=
        /usr/bin/systemd-nspawn
        /usr/bin/systemd-vmspawn
        /usr/bin/systemd-analyze
        /usr/bin/systemd-repart
        /usr/bin/homectl
        /usr/bin/bootctl

# glibc locale/charset machinery (Locale=C.UTF-8 needs none of it)
RemoveFiles=
        /usr/lib/gconv
        /usr/bin/localedef
        /usr/bin/ldconfig
        /usr/bin/sln

# gcc-libs sanitizer runtimes, linked by nothing in the image
RemoveFiles=
        /usr/lib/libasan.so*
        /usr/lib/libtsan.so*
        /usr/lib/libhwasan.so*
        /usr/lib/liblsan.so*
        /usr/lib/libubsan.so*

# test and certificate tools (curl keeps its libraries)
RemoveFiles=
        /usr/bin/pcre2test
        /usr/bin/captree
        /usr/bin/openssl
        /usr/bin/certtool
        /usr/bin/p11tool
        /usr/bin/ocsptool
        /usr/bin/psktool
        /usr/bin/srptool
        /usr/bin/gnutls-*

# data: only the console terminal types, UTC, PC keymaps
RemoveFiles=
        /usr/share/terminfo/[!dl]*
        /usr/share/zoneinfo/[!U]*
        /usr/share/kbd/keymaps/amiga
        /usr/share/kbd/keymaps/atari
        /usr/share/kbd/keymaps/mac
        /usr/share/kbd/keymaps/ppc
        /usr/share/kbd/keymaps/sun
        /usr/share/kbd/keymaps/pine
