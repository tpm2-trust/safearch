# Extra configuration for mkosi's default initrd. mkosi parses this directory
# like a config directory, so mkosi.extra/ next to this file is copied into
# the initrd: the usb-bootdev service and script, and masks for the
# sysext/confext units (extension images from the ESP must never be merged).
# (Packages for the initrd are set with InitrdPackages= in ../mkosi.conf.)

[Output]
# The initrd sits inside the UKI, which firmware loads over its own USB driver.
CompressLevel=19

[Content]
# Pulled in as dependencies, unused in the initrd (~25 MB uncompressed).
RemoveFiles=
        /usr/bin/sql*
        /usr/bin/showdb
        /usr/bin/showstat4
        /usr/bin/dbhash
        /usr/bin/dbdump
        /usr/bin/index_usage
        /usr/share/file/misc/magic.mgc
