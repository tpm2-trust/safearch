# Extra configuration for mkosi's default initrd. mkosi parses this directory
# like a config directory, so mkosi.extra/ next to this file is copied into
# the initrd: here the masks for the sysext/confext units (extension images
# must never be merged into the verified /usr and /etc).
#
# The build profile is inherited, so mkosi.profiles/<variant>/mkosi.extra/
# next to this file is copied in as well:
#   usb      usb-bootdev.service + script (authorize only the boot medium)
#   network  netroot.service + script (fetch and verify root over HTTP) and
#            the networkd config for the initrd
# (Packages and drivers for the initrd are set with InitrdPackages= and
# KernelInitrdModules= in ../mkosi.conf and ../mkosi.profiles/<variant>/.)

[Output]
# The initrd sits inside the UKI, which firmware loads over its own USB driver.
CompressLevel=19

[Content]
# Pulled in as dependencies, unused in the initrd (~25 MB uncompressed).
RemoveFiles=
        /usr/bin/sql*
        /usr/bin/showdb
        /usr/bin/showstat4
        /usr/bin/dbhash
        /usr/bin/dbdump
        /usr/bin/index_usage
        /usr/share/file/misc/magic.mgc
