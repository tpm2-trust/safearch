# The root is the chosen combination's layers, stacked at /sysroot by the boot
# path (usb-bootdev or netroot; there is no root=). Without them the boot stops
# here (the target's OnFailure: the emergency shell), it never switches into an
# empty /sysroot.
[Unit]
After=usb-bootdev.service netroot.service
AssertPathIsMountPoint=/sysroot
