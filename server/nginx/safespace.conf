# The share, read-only, under /safespace/ (installed by server/setup.sh with
# @SHARE@ filled in). Content-Length matters: the initrd sizes its tmpfs and
# checks the RAM with it before the download.
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    autoindex     off;
    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # Nothing but reading the published files; hidden files (rsync's
    # temp directory while a release is uploaded) never.
    location ~ /\. { deny all; }
    location /safespace/ {
        alias @SHARE@/;
        limit_except GET HEAD { deny all; }
    }
    location / { return 404; }
}
